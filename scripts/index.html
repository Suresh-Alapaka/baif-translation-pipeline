<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Run Script Demo</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 480px;
    margin: 80px auto;
    text-align: center;
  }
  button {
    padding: 12px 24px;
    font-size: 16px;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: white;
  }
  button:disabled {
    background: #93c5fd;
    cursor: not-allowed;
  }
  #status {
    margin-top: 20px;
    padding: 12px;
    border-radius: 6px;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .success { background: #dcfce7; color: #166534; }
  .error   { background: #fee2e2; color: #991b1b; }
</style>
</head>
<body>
  <h2>Run Backend Script</h2>
  <button id="runBtn">Run Script</button>
  <div id="status"></div>

  <script>
    const btn = document.getElementById('runBtn');
    const statusDiv = document.getElementById('status');

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = 'Running...';
      statusDiv.className = '';
      statusDiv.textContent = '';

      try {
        const response = await fetch('/run-script', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: 'Claude' }) // optional payload
        });

        const data = await response.json();

        if (data.success) {
          statusDiv.className = 'success';
          statusDiv.textContent = `✅ ${data.message}\n\n${data.output}`;
        } else {
          statusDiv.className = 'error';
          statusDiv.textContent = `❌ ${data.message}\n\n${data.error || ''}`;
        }
      } catch (err) {
        statusDiv.className = 'error';
        statusDiv.textContent = `❌ Request failed: ${err.message}`;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Run Script';
      }
    });
  </script>
</body>
</html>
